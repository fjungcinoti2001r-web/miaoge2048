<link rel="stylesheet" href="css/reset.min.css">
<link rel="stylesheet" href="css/style.css">

<style>
  /* 绑定 assets/tiles/avatar_{n}.png 立绘素材 */
  .tile--2    { background-image: url('assets/tiles/avatar_1.png') !important; }
  .tile--4    { background-image: url('assets/tiles/avatar_2.png') !important; }
  .tile--8    { background-image: url('assets/tiles/avatar_3.png') !important; }
  .tile--16   { background-image: url('assets/tiles/avatar_4.png') !important; }
  .tile--32   { background-image: url('assets/tiles/avatar_5.png') !important; }
  .tile--64   { background-image: url('assets/tiles/avatar_6.png') !important; }
  .tile--128  { background-image: url('assets/tiles/avatar_7.png') !important; }
  .tile--256  { background-image: url('assets/tiles/avatar_8.png') !important; }
  .tile--512  { background-image: url('assets/tiles/avatar_9.png') !important; }
  .tile--1024 { background-image: url('assets/tiles/avatar_10.png') !important; }
  .tile--2048 { background-image: url('assets/tiles/avatar_11.png') !important; }

  .tile {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    user-select: none;
    -webkit-user-select: none;
  }

    display: none;
    position: fixed;
    top: 0;
    left: 0;

    height: 100vh;
    background: rgba(0, 0, 0, 0.72);

    align-items: center;
    box-sizing: border-box;
    padding: 10px;

    border-radius: 24px;

    max-width: 86vw;
    padding: 24px 20px;
    box-sizing: border-box;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
    text-align: center;
    position: relative;
  }

  .settings-card-title {
    color: #b45309;
    font-size: 24px;
    font-weight: 900;
    margin-bottom: 18px;
    letter-spacing: 1px;
  }

  .menu-pill-btn {
    width: 100%;
    border: none;
    border-radius: 22px;
    padding: 11px 0;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.1s ease;

  .btn-green-pill { background: #22c55e; color: #fff; box-shadow: 0 4px #15803d; }

  .btn-blue-pill { background: #3b82f6; color: #fff; box-shadow: 0 4px #1d4ed8; margin-top: 14px; }

  .btn-pink-pill { background: #fca5a5; color: #fff; box-shadow: 0 4px #f43f5e; margin-top: 12px; }
  .btn-pink-pill:active { box-shadow: 0 2px #f43f5e; }

  .save-info-group { text-align: left; margin-top: 18px; margin-bottom: 8px; }
  .save-header-txt { color: #92400e; font-size: 14px; font-weight: 900; }
  .save-sub-txt { color: #b45309; font-size: 10px; transform: scale(0.92); transform-origin: left center; margin-top: 2px; }

  .save-slot-box {
    background: #ffffff;
    border: 1.5px dashed #f59e0b;
    border-radius: 12px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 12px;
    box-sizing: border-box;
  }
  .save-empty-text { color: #57534e; font-size: 16px; font-weight: bold; letter-spacing: 0.5px; }

  .save-record-item { width: 100%; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .save-record-details { text-align: left; }
  .save-record-time { font-size: 11px; color: #78716c; }
  .save-record-score { font-size: 13px; font-weight: bold; color: #b45309; margin-top: 2px; }
  .save-delete-btn {
    background: #fee2e2;
    border: 1px solid #fca5a5;
    color: #ef4444;
    border-radius: 8px;
    padding: 4px 8px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
  }
  .save-delete-btn:active { background: #fecaca; }

  /* ================= 纯 CSS 严格 1:1 成绩单海报卡 ================= */
  #poster-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    max-height: 98vh;
  }

  .poster-card-1to1 {
    width: 320px;
    height: 320px;
    max-width: 86vw;
    max-height: 86vw;
    background: #fff9ed;
    border: 2.5px solid #fde68a;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    box-sizing: border-box;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
  }

  .poster-top-pill {
    background: #ffffff;
    border: 1.5px solid #fcd34d;
    border-radius: 14px;
    padding: 2px 18px;
    color: #78350f;
    font-weight: bold;
    font-size: 12px;
    letter-spacing: 0.5px;
  }

  .poster-main-title {
    color: #b45309;
    font-size: 18px;
    font-weight: 900;
    line-height: 20px;
    margin-top: -2px;
  }

  /* 居中立绘容器 */
  .poster-avatar-holder {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: -2px 0;
  }
  .poster-avatar-holder img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
  }

  .poster-unlocked-tag {
    background: #fff1f2;
    border: 1px solid #fecdd3;
    border-radius: 12px;
    padding: 2px 16px;
    color: #e11d48;
    font-weight: bold;
    font-size: 11px;
  }

  /* 战力展示框 */
  .poster-score-board {
    background: #ffffff;
    border: 1.5px solid #e5e7eb;
    border-radius: 10px;
    width: 90%;
    padding: 4px 0;
    text-align: center;
    box-sizing: border-box;
  }
  .poster-score-label {
    color: #4b5563;
    font-size: 11px;
    font-weight: bold;
    line-height: 14px;
  }
  .poster-score-value {
    color: #c2410c;
    font-size: 26px;
    font-weight: 900;
    line-height: 28px;
    font-family: "Arial Rounded MT Bold", "Microsoft YaHei", sans-serif;
  }

  /* 底部双层药丸样式 */
  .poster-bottom-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;

    border: 1px dashed #fcd34d;

<!-- 系统菜单弹窗 -->

  16:   { avatarIndex: 4,  name: "惠忍" },

  128:  { avatarIndex: 7,  name: "成瞎子" },

var game = null;
var bestScore = 0;
var scoreDiv = document.getElementById('score');
var bestScoreDiv = document.getElementById('bestScore');
var roleBadgeDiv = document.getElementById('role-badge');
var endDiv = document.getElementById('end');
var size = 4;
var nextId = 1;
var score = 0;
var hasMergedThisTurn = false;
var lastMaxMergeVal = 2;

function initGame() {
  game = Array(size * size).fill(null);
  initBestScore();
}

function initBestScore() {
  bestScore = localStorage.getItem('bestScore') || 0;
  bestScoreDiv.innerHTML = bestScore;
}

function getMaxTile() {
  var maxVal = 2;
  for (var i = 0; i < game.length; i++) {
    if (game[i] && game[i].value > maxVal) {
      maxVal = game[i].value;
    }
  }
  return maxVal;
}

function updateRoleBadge() {
  var maxVal = getMaxTile();
  var info = TILE_INFO[maxVal] || { name: "洪文定" };
  if (roleBadgeDiv) {
    roleBadgeDiv.innerHTML = "当前阶段：" + info.name;
  }
}

function drawBackground() {
  var tileContainer = document.getElementById('tile-container');
  tileContainer.innerHTML = '';
  for (var i = 0; i < game.length; i++) {
    var tileDiv = document.createElement('div');
    var x = i % size;
    var y = Math.floor(i / size);
    tileDiv.style.top = y * 100 + 'px';
    tileDiv.style.left = x * 100 + 'px';
    tileDiv.classList.add("background");
    tileContainer.appendChild(tileDiv);
  }
}

function positionTile(tile, elm) {

  var y = Math.floor(tile.index / size);
  elm.style.top = y * 100 + 'px';
  elm.style.left = x * 100 + 'px';
}

          var tileDiv = document.createElement('div');
          positionTile(tile, tileDiv);
          tileDiv.classList.add('tile', 'tile--' + tile.value);
          tileDiv.id = tile.id;
          setTimeout(function () {
            tileDiv.classList.add("tile--pop");
          }, tile.mergedIds ? 1 : 150);
          tileDiv.innerHTML = '<p>' + tile.value + '</p>';
          tileContainer.appendChild(tileDiv);
        })();
      } else {
        var currentElement = document.getElementById(tile.id);
        if (currentElement) {
          positionTile(tile, currentElement);
        }
      }
    }
  }
}

function gameOver() {
  if (game.filter(function (number) { return number === null; }).length === 0) {
    var sameNeighbors = game.find(function (tile, i) {
      var isRightSame = game[i + 1] && (i + 1) % 4 !== 0 ? tile.value === game[i + 1].value : false;
      var isDownSame = game[i + 4] ? tile.value === game[i + 4].value : false;
      return isRightSame || isDownSame;
    });
    return !sameNeighbors;
  }
  return false;
}

function generateNewNumber() {
  return Math.random() * 100 <= 90 ? 2 : 4;
}

function addRandomNumber() {
  var emptyCells = game.map(function (_, index) { return index; }).filter(function (index) { return game[index] === null; });
  if (emptyCells.length === 0) return;
  var newPos = emptyCells[Math.floor(Math.random() * emptyCells.length)];
  var newObj = {
    id: nextId++,
    index: newPos,
    value: generateNewNumber()
  };
  game.splice(newPos, 1, newObj);
}

function getIndexForPoint(x, y) { return y * size + x; }

function reflectGrid(grid) {
  var reflectedGame = Array(size * size).fill(0);
  for (var row = 0; row < size; row++) {
    for (var col = 0; col < size; col++) {
      reflectedGame[getIndexForPoint(col, row)] = grid[getIndexForPoint(size - col - 1, row)];
    }
  }
  return reflectedGame;
}

function rotateLeft90Deg(grid) {
  var rotatedGame = Array(size * size).fill(0);
  for (var row = 0; row < size; row++) {
    for (var col = 0; col < size; col++) {
      rotatedGame[getIndexForPoint(col, row)] = grid[getIndexForPoint(size - 1 - row, col)];
    }
  }
  return rotatedGame;
}

function rotateRight90Deg(grid) {
  var rotatedGame = Array(size * size).fill(0);
  for (var row = 0; row < size; row++) {
    for (var col = 0; col < size; col++) {
      rotatedGame[getIndexForPoint(col, row)] = grid[getIndexForPoint(row, size - 1 - col)];
    }
  }
  return rotatedGame;
}

function shiftGameRight(gameGrid) {
  return reflectGrid(shiftGameLeft(reflectGrid(gameGrid)));
}

function shiftGameLeft(gameGrid) {
  var newGameState = [];
  var totalAdd = 0;
  for (var i = 0; i < size; i++) {
    var firstPos = 4 * i;
    var currentRow = gameGrid.slice(firstPos, size + 4 * i);
    var filteredRow = currentRow.filter(function (row) { return row; });

    for (var k = 0; k < filteredRow.length; k++) {
      delete filteredRow[k].mergedIds;
    }

    for (var j = 0; j < filteredRow.length - 1; j++) {
      if (filteredRow[j].value === filteredRow[j + 1].value) {
        var sum = filteredRow[j].value * 2;
        filteredRow[j] = {
          id: nextId++,
          mergedIds: [filteredRow[j].id, filteredRow[j + 1].id],
          value: sum
        };
        filteredRow.splice(j + 1, 1);
        score += sum;
        totalAdd += sum;
        hasMergedThisTurn = true;
        if (sum > lastMaxMergeVal) lastMaxMergeVal = sum;
      }
    }
    while (filteredRow.length < size) {
      filteredRow.push(null);
    }
    newGameState = [].concat(newGameState, filteredRow);
  }

  if (totalAdd > 0) {
    scoreDiv.innerHTML = score;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('bestScore', bestScore);
      initBestScore();
    }
  }
  return newGameState;
}

function shiftGameUp(gameGrid) {
  return rotateRight90Deg(shiftGameLeft(rotateLeft90Deg(gameGrid)));
}

function shiftGameDown(gameGrid) {
  return rotateLeft90Deg(shiftGameLeft(rotateRight90Deg(gameGrid)));
}

function stepGame(newGrid) {
  var isChanged = false;
  for (var i = 0; i < game.length; i++) {
    if ((game[i] === null && newGrid[i] !== null) ||
        (game[i] !== null && newGrid[i] === null) ||
        (game[i] && newGrid[i] && (game[i].id !== newGrid[i].id || game[i].value !== newGrid[i].value))) {
      isChanged = true;
      break;
    }
  }
  if (!isChanged) return;

  if (hasMergedThisTurn) {
    AudioManager.playMergeSound(lastMaxMergeVal);
  } else {
    AudioManager.playMoveSound();
  }
  hasMergedThisTurn = false;
  lastMaxMergeVal = 2;

  var prevGame = [].concat(game);
  game = newGrid.map(function (tile, index) {
    return tile ? _extends({}, tile, { index: index }) : null;
  });
  addRandomNumber();
  updateDOM(prevGame, game);

  if (gameOver()) {
    setTimeout(function () {
      endDiv.classList.add('active');
    }, 800);
  }
}

// 触摸与手机滑动
var xDown = null;
var yDown = null;
document.addEventListener('touchstart', function (evt) {
  xDown = evt.touches[0].clientX;
  yDown = evt.touches[0].clientY;
}, false);

document.addEventListener('touchend', function (evt) {
  if (!xDown || !yDown) return;
  var xUp = evt.changedTouches[0].clientX;
  var yUp = evt.changedTouches[0].clientY;
  handleSwipe(xDown, yDown, xUp, yUp);
  xDown = null;
  yDown = null;
}, false);

// 电脑端鼠标拖动
var isMouseDown = false;
var mouseStartX = 0;
var mouseStartY = 0;
document.addEventListener('mousedown', function (evt) {
  isMouseDown = true;
  mouseStartX = evt.clientX;
  mouseStartY = evt.clientY;
});

document.addEventListener('mouseup', function (evt) {
  if (!isMouseDown) return;
  isMouseDown = false;
  handleSwipe(mouseStartX, mouseStartY, evt.clientX, evt.clientY);
});

function handleSwipe(startX, startY, endX, endY) {
  var xDiff = startX - endX;
  var yDiff = startY - endY;
  if (Math.abs(xDiff) > 20 || Math.abs(yDiff) > 20) {
    if (Math.abs(xDiff) > Math.abs(yDiff)) {
      if (xDiff > 0) stepGame(shiftGameLeft(game));
      else stepGame(shiftGameRight(game));
    } else {
      if (yDiff > 0) stepGame(shiftGameUp(game));
      else stepGame(shiftGameDown(game));
    }
  }
}

// 键盘按键（方向键 + WASD）
window.addEventListener("keydown", function (evt) {
  var e = evt || window.event;
  var code = e.keyCode || e.which;

  if ([37, 38, 39, 40, 65, 87, 68, 83].indexOf(code) > -1) {
    e.preventDefault();
  }

  switch (code) {
    case 37:
    case 65:
      stepGame(shiftGameLeft(game)); 
      break;
    case 38:
    case 87:
      stepGame(shiftGameUp(game)); 
      break;
    case 39:
    case 68:
      stepGame(shiftGameRight(game)); 
      break;
    case 40:
    case 83:
      stepGame(shiftGameDown(game)); 
      break;
  }
}, true);

function newGameStart() {
  document.getElementById('tile-container').innerHTML = '';
  endDiv.classList.remove('active');
  score = 0;
  scoreDiv.innerHTML = score;
  initGame();
  drawBackground();
  var previousGame = [].concat(game);
  addRandomNumber();
  addRandomNumber();
  updateDOM(previousGame, game);
}

// ================= 存档管理 =================
function renderSaveSlots() {
  var saveBox = document.getElementById('save-slot-box');
  if (!saveBox) return;
  var savedData = localStorage.getItem('miao2048_save');

  if (!savedData) {
    saveBox.innerHTML = '<div class="save-empty-text">暂无本地存档</div>';
    return;
  }

  try {
    var parsed = JSON.parse(savedData);
    var maxVal = 2;
    if (parsed.game && Array.isArray(parsed.game)) {
      parsed.game.forEach(function(tile) {
        if (tile && tile.value > maxVal) maxVal = tile.value;
      });
    }
    var roleInfo = TILE_INFO[maxVal] || { name: "洪文定" };
    var timeStr = parsed.time || "近期存档";

    saveBox.innerHTML = 
      '<div class="save-record-item" id="trigger-load-game" title="点击读取该存档">' +
        '<div class="save-record-details">' +
          '<div class="save-record-time">📅 ' + timeStr + '</div>' +
          '<div class="save-record-score">当前：' + roleInfo.name + ' (战力 ' + (parsed.score || 0) + ')</div>' +
        '</div>' +
        '<button class="save-delete-btn" id="trigger-del-game" title="删除存档">❌ 删除</button>' +
      '</div>';

    document.getElementById('trigger-load-game').addEventListener('click', function(e) {
      if (e.target.id === 'trigger-del-game') return;
      game = parsed.game;
      score = parsed.score;
      nextId = parsed.nextId;
      scoreDiv.innerHTML = score;
      document.getElementById('tile-container').innerHTML = '';
      drawBackground();
      drawGame(game.filter(function (t) { return t; }), true);
      updateRoleBadge();
      document.getElementById('settings-modal').style.display = 'none';
      window.focus();
    });

    document.getElementById('trigger-del-game').addEventListener('click', function(e) {
      e.stopPropagation();
      localStorage.removeItem('miao2048_save');
      renderSaveSlots();
    });

  } catch(e) {
    saveBox.innerHTML = '<div class="save-empty-text">暂无本地存档</div>';
  }
}

  if (posterClose) {
    posterClose.addEventListener('click', function () { 
      posterModal.style.display = 'none'; 
      window.focus();
    });
  }

  newGameStart();
});
